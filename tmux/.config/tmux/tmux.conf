####################
# General Settings #
####################
set -g prefix C-a # prefix key(s)
# send the prefix itself to pane
bind -N "Send prefix key through" C-a send-prefix
unbind C-b

# Start shells as interactive (non-login) shells so they read ~/.bashrc
set -g default-command "$SHELL -i"
# 256 colors
# also keep the TERM be screen* or tmux* all the time or applications
# might have display problems, see https://github.com/tmux/tmux/wiki/FAQ
set -g default-terminal "tmux-256color"
set -su terminal-features # reset first, in case of re-sourcing config
set -sa terminal-features ",tmux-256color:RGB"
set -sa terminal-features ",gnome*:RGB"
set -sa terminal-features ",foot*:sixel"
set -g mouse on # mouse support
set -g mode-keys vi # set key mode to vi
set -g status-keys emacs # use emacs keys in command prompt
set -g history-limit 10000 # history
set -g base-index 1 # start numbering windows from 1 instead of zero
set -g pane-base-index 1 # start numbering panes from 1 instead of zero
set -g renumber-windows on # re-number windows when one is closed
set -g escape-time 0 # time to wait for ESC key
set -g display-time 3000 # press a key to close display message
set -g display-panes-time 3000 # display pane numbers
set -g repeat-time 800 # wait longer for continous keybindings
set -g status-interval 3 # update interval
set -g monitor-activity on
set -g visual-activity off # Do not report activity in status bar
set -g focus-events on
set -g main-pane-width 50%
set -g set-clipboard on # also copy to system clipboard
set -g input-buffer-size 20971520 # 20MB buffer for sixel images

###############
# Keybindings #
###############
# key mapping to reload config file
bind -N "Send next pressed keys" C-p command-prompt -kp 'key' 'send %%'

bind -N "Toggle enable/disable of all keybindings" -n M-A {
    run "tmux list-keys > /tmp/tmux-keys"
    set -g prefix None
    unbind -a -T root
    bind -n M-A {
        source "/tmp/tmux-keys"
        source "$HOME/.config/tmux/tmux.conf"
        run "rm /tmp/tmux-keys"
    }
}

unbind -T copy-mode-vi MouseDragEnd1Pane
# more vim keybindings in copy mode
bind -T copy-mode-vi MouseDown1Pane send-keys -X clear-selection
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v { send-keys -X rectangle-toggle
                           send-keys -X begin-selection }
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X clear-selection

####################
# Root Keybindings #
####################
# The configs in this section is trying to make tmux behave more like a WM by
# - emulating a "tiled" layout and
# - using root keybindings,
# The keybindings are intended to be similar to AwesomeWM/dwm
bind -N "Reload configuration file" -n M-R source-file "~/.config/tmux/tmux.conf"

# manage panes
# Navigate
bind -N "Create a new pane"   -n M-Enter split-window -c "#{pane_current_path}"
bind -N "Create a new window" -n M-N new-window -c "#{pane_current_path}"
bind -N "Go to the next pane" -n M-n select-pane -Z -t +
bind -N "Go to the prev pane" -n M-p select-pane -Z -t -
bind -N "Maximize the pane"   -n M-f resize-pane -Z
# Resize
bind -N "Resize the master pane left by 4 rows"  -n M-h resize-pane -L 4
bind -N "Resize the master pane right by 4 rows" -n M-l resize-pane -R 4
bind -N "Resize the slave pane up by 2 lines"    -n M-H resize-pane -U 2
bind -N "Resize the slave pane down by 2 lines"  -n M-L resize-pane -D 2
# move
bind -N "Move the pane down"      -n M-J swap-pane -d -t +
bind -N "Move the pane up"        -n M-K swap-pane -d -t -
bind -N "Move the pane to master" -n M-Space swap-pane -d -t 0

# Windows navigations
bind -N "Go to the last window"     -n M-/ last-window
bind -N "Go to the next window"     -n M-. next-window
bind -N "Go to the previous window" -n M-, previous-window
# Goto specific window
bind -N "Go to window 1" -n M-1 select-window -t :1
bind -N "Go to window 2" -n M-2 select-window -t :2
bind -N "Go to window 3" -n M-3 select-window -t :3
bind -N "Go to window 4" -n M-4 select-window -t :4
bind -N "Go to window 5" -n M-5 select-window -t :5
bind -N "Go to window 6" -n M-6 select-window -t :6
bind -N "Go to window 7" -n M-7 select-window -t :7
bind -N "Go to window 8" -n M-8 select-window -t :8
bind -N "Go to window 9" -n M-9 select-window -t :9

# Switch clients
bind -N "Go to the last session"     -n M-\\ switch-client -l
bind -N "Go to the next session"     -n M-]  switch-client -n
bind -N "Go to the previous session" -n M-[  switch-client -p

# Choose tree (like activity view)
bind -N "Open tree view" -n M-a choose-tree -Z
# Toggle status line
bind -N "Toggle the status bar" -n M-b set-option status

# Session-wide
bind -N "Detach client"    -n M-Q detach-client
bind -N "Run tmux command" -n M-x command-prompt
bind -N "Run tmux command" -n M-: command-prompt
bind -N "List keybindings" -n M-'?' list-keys -N

# copy and paste
bind -N "Enter copy mode" -n M-c copy-mode
bind -N "Paste"           -n M-v paste-buffer
bind -N "Choose buffer"   -n M-V choose-buffer

#########
# Hooks #
#########

# Hooks for reload(keep) layout
set-hook -g pane-exited         { select-layout "main-vertical" }
set-hook -g after-kill-pane     { select-layout "main-vertical" } # remove panes
set-hook -g after-split-window  { select-layout "main-vertical" } # create panes

##############
# Status bar #
##############

# set the style
set -g status-style bg=default,bold
set -g message-command-style fg=color3,bg=default
set -g message-style bg=default
set -g pane-border-style fg=color8,bg=default
set -g pane-active-border-style fg=color14,bg=default
set -g copy-mode-selection-style fg=default,bg=color237
set -g copy-mode-position-style fg=color14,reverse

# statusline
set -g status-left-length 20
set -g status-right-length 40
set -g status-position bottom
set -g status-justify centre
set -g window-status-separator ""
# Use [no]reverse to modify fore/background, instead of use fg/bg directly.
# The reason is that the foreground cannot be set to terminal's background color
# with a color number or 'none'. Using 'reverse' will do that. Note you have to
# specify 'noreverse' anywhere else, since the attributes seems to persist.
set -g status-left "\
#[fg=#{?client_prefix,color3,color14},reverse] #S \
#[fg=#{?client_prefix,color3,color14},noreverse]"
set -g status-right "\
#[fg=color14,noreverse]\
#[fg=color14,reverse] #{user}@#H "
set -g window-status-format "\
#[fg=color7,reverse] #I. #W \
#[fg=color7,noreverse]"
set -g window-status-current-format "\
#[fg=#{?window_zoomed_flag,color3,color14},reverse] #I. #W #P/#{window_panes} \
#[fg=#{?window_zoomed_flag,color3,color14},noreverse]"
